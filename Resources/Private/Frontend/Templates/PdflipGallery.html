<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Main">
    <f:if condition="{files}">
        <f:asset.css identifier="pdflip-gallery" href="EXT:ws_pdflip/Resources/Public/Css/pdflip-gallery.css" />
        <ul class="pdflip-gallery">
            <f:for each="{files}" as="file">
                <f:variable name="title">{f:if(condition: file.title, then: file.title, else: file.name)}</f:variable>
                <li class="pdflip-gallery-item">
                    <a href="{file.publicUrl}" id="c{data.uid}-{file.uid}" data-pdflip-lightbox data-pdflip-options="{pdflipOptions}"
                       aria-label="{f:translate(key: 'LLL:EXT:ws_pdflip/Resources/Private/Language/Backend.xlf:gallery.open', arguments: {0: title})}">
                        <f:if condition="{pdflipSettings.galleryCovers} == 'client'">
                            <f:then>
                                <img class="pdflip-gallery-cover" data-pdflip-cover="{file.publicUrl}" alt="" width="{pdflipSettings.galleryThumbnailWidth}" />
                            </f:then>
                            <f:else>
                                <f:image image="{file}" maxWidth="{pdflipSettings.galleryThumbnailWidth}" class="pdflip-gallery-cover" alt="" loading="lazy" />
                            </f:else>
                        </f:if>
                        <span class="pdflip-gallery-title">{title}</span>
                    </a>
                </li>
            </f:for>
        </ul>
    </f:if>
</f:section>
</html>
