name: CI

on:
  push:
    branches: ['release/**']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: XML, XLIFF and YAML
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, yaml
          for f in glob.glob('Configuration/**/*.xml', recursive=True) + glob.glob('Resources/Private/**/*.xlf', recursive=True):
              ET.parse(f)
          for f in glob.glob('Configuration/**/*.yaml', recursive=True):
              yaml.safe_load(open(f))
          print('ok')
          PY
      - name: Bundled pdflip
        run: node --check Resources/Public/Pdflip/pdflip.global.js
